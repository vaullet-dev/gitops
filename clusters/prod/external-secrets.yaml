# Wave -1. External Secrets Operator: copies values out of OpenBao into plain
# Kubernetes Secrets, so a service reads an env var and never talks to OpenBao.
#
# That copy is also what makes a sealed OpenBao survivable. After a reboot
# OpenBao waits for a human with unseal keys; the Secrets ESO already wrote are
# still there, so pods keep starting. Only CHANGING a secret waits for the
# unseal.
#
# No ClusterSecretStore here. There is one per service, created when the
# service is onboarded -- see README, "Secrets".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      values: |
        installCRDs: true
        replicaCount: 1

        resources:
          requests: { cpu: 10m, memory: 64Mi }
          limits:   { memory: 256Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
        certController:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the CRDs exceed the 262144-byte annotation limit
