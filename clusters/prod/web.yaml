# Wave 2. The public site, sourced from its own repo rather than from here:
# editing the page is one commit in vaullet-dev/web, and Argo redeploys it.
# That keeps content changes out of the cluster's own repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: services
  source:
    repoURL: https://github.com/vaullet-dev/web.git
    targetRevision: master
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: web
  # web deploys blue-green: the cutover is the Rollouts controller changing the
  # `web` Service selector, and Argo CD already ignores that. Nothing in git is
  # rewritten during a deploy, so there is no drift to ignore.
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
