# Wave -1, with the other platform plumbing: a ClusterSecretStore has to exist
# before any ExternalSecret that names it.
#
# Per-service stores live here rather than in each service's repository because
# they are cluster-scoped, and the `services` project may not create those. One
# file per service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/vaullet-dev/gitops.git
    targetRevision: main
    path: apps/secret-stores
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
