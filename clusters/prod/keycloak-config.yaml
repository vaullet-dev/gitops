# Wave 3, after Keycloak (wave 2). Realm configuration as code, per ADR-006 "Realm configuration
# is code": keycloak-config-cli applies apps/keycloak-config/realm/*.yaml to the running Keycloak
# on every sync of this Application.
#
# A separate Application from `keycloak`, on purpose. The import is a PostSync hook that needs a
# secret from OpenBao and a reachable Keycloak; if either is missing, only this Application goes
# red. Keycloak itself keeps syncing and serving, and its own sync is never held open by a hook
# that is waiting on something else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://github.com/vaullet-dev/gitops.git
    targetRevision: main
    path: apps/keycloak-config
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # Retry without limit, backing off to one attempt every 5 minutes. The import is a PostSync hook,
    # so it only runs at the end of a sync that succeeded, and the first sync after a merge can fail
    # for reasons that fix themselves a few minutes later: a secret not yet in OpenBao, or a store
    # condition secret-stores has not applied yet. Argo CD does not start another sync while the app
    # reports Synced, so without retries that import is simply lost. On 2026-09-30 the default five
    # attempts ran out within five minutes, and the realm waited for a sync by hand.
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
