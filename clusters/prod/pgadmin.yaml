# Wave 2: after the secret stores (-1) and the databases (1), so dba_rw exists on every
# cluster by the time pgAdmin first connects. pgAdmin 4, no route, reached through an SSH
# tunnel (README, "Reaching things"; gitops#33).
#
# Nothing to do by hand first: both passwords (pgAdmin's login, dba_rw's) are generated
# by External Secrets on the first sync, not stored in OpenBao.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgadmin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/vaullet-dev/gitops.git
    targetRevision: main
    path: apps/pgadmin
  destination:
    server: https://kubernetes.default.svc
    namespace: pgadmin
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    # The login Secret is generated in the same sync, so the first pod can start before it
    # exists; keep retrying rather than giving up on the first sync.
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
