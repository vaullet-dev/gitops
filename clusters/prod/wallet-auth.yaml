# Wave 2, with the other services: after the operators (-1), the databases (1),
# and therefore after auth_db exists and its migrator role has a password.
#
# The service repository ships the migration Job, the Deployment, its Service and
# the HTTPRoute that serves it at vaullet.dev/api/auth. Its OAUTH2_ISSUER_URI must
# match Keycloak's issuer, https://vaullet.dev/auth/realms/vaullet (keycloak.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wallet-auth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: services
  source:
    repoURL: https://github.com/vaullet-dev/wallet-auth-service.git
    targetRevision: master
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: wallet-auth
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
