# Wave 2, with the other services: after the operators (-1), the databases (1),
# and therefore after auth_db exists and its migrator role has a password.
#
# v0 ships the migration Job and nothing that listens on a port. application.yaml
# declares the JWT issuer with no default, so an unset OAUTH2_ISSUER_URI means no
# JwtDecoder and the context refuses to start rather than serving unauthenticated
# -- and Keycloak is not deployed. The Deployment, Service and HTTPRoute land in
# the service repository when it is.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wallet-auth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: services
  source:
    repoURL: https://github.com/vaullet-dev/wallet-auth-service.git
    targetRevision: master
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: wallet-auth
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
