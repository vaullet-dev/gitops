# Wave 2. Keycloak, the only signer in the platform (ADR-006). After the
# databases (wave 1), because it needs auth_db and its own role's password.
#
# The codecentric keycloakx CHART running the OFFICIAL quay.io/keycloak/keycloak
# image. There is no official Helm chart -- upstream ships the Operator and the
# images only. Three options were weighed:
#
#   * codecentric keycloakx   chart 7.3.2 -> Keycloak 26.7.4. A pinned chart
#     version in git, the same shape as Traefik, cert-manager, OpenBao and
#     External Secrets. CHOSEN.
#   * the official Operator   trails upstream (26.4.0), and adds ~10 CRDs and an
#     operator pod to manage one replica on one machine. Its best feature,
#     KeycloakRealmImport, is already spoken for: ADR-006 names keycloak-config-cli,
#     which reconciles rather than importing once. REVISIT when this becomes
#     multi-cluster -- upgrading several Keycloaks in step is what an operator is for.
#   * bitnami/keycloak        REJECTED. Not on licence: Keycloak is Apache-2.0
#     whoever packages it. On DISTRIBUTION -- Broadcom moved the catalog in
#     August 2025, bitnami/keycloak now has ZERO tags, and the images the chart
#     pins live in bitnamilegacy/, frozen at 26.3.3. Four unpatched minor
#     versions behind, on an identity provider.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 7.3.2          # Keycloak 26.7.4
      helm:
        values: |
          image:
            tag: "26.7.4"

          # keycloakx ships no default command: how Keycloak starts is the
          # deployment's decision. Without this the pod runs nothing.
          command:
            - "/opt/keycloak/bin/kc.sh"
            - "start"
            - "--http-enabled=true"
            - "--http-port=8080"

          # THE CHART DEFAULTS THIS TO /auth. Left alone, the issuer becomes
          # https://auth.vaullet.dev/auth/realms/vaullet -- but ADR-006 fixes it as
          # https://auth.<cluster>/realms/vaullet, and that string is written into
          # every token's `iss` claim and every resource server's validation.
          # Shipping it wrong produces a Keycloak that looks fine and mints tokens
          # nothing accepts; correcting it later invalidates every token issued.
          http:
            relativePath: "/"

          # The chart's own block, not extraEnv: dbchecker validates THIS and
          # refuses to render without database.hostname, while Keycloak reads the
          # KC_DB_* variables the chart derives from it. One fact, one place.
          database:
            vendor: postgres
            hostname: platform-rw.postgres.svc
            port: 5432
            database: auth_db
            username: keycloak
            existingSecret: keycloak-db
            existingSecretKey: KC_DB_PASSWORD

          # mode, not headers -- `headers` is silently ignored and leaves the
          # chart default `forwarded`. That is RFC 7239; Traefik sends
          # X-Forwarded-*, so Keycloak would build redirect URLs with http:// and
          # the login flow would break in a browser as a Keycloak-looking bug.
          proxy:
            mode: xforwarded

          extraEnv: |
            - name: KC_DB_SCHEMA
              value: keycloak_schema
            - name: KC_HOSTNAME
              value: https://auth.vaullet.dev

          extraEnvFrom: |
            - secretRef:
                name: keycloak-admin     # KC_BOOTSTRAP_ADMIN_USERNAME / _PASSWORD

          # Waits for the database before starting, so the first start does not
          # race CloudNativePG setting the role's password.
          dbchecker:
            enabled: true

          # Keycloak manages its own TABLES but will not create the SCHEMA they
          # live in: with KC_DB_SCHEMA naming a schema that does not exist,
          # Liquibase fails on first start with an error that reads like a
          # permissions problem.
          #
          # An init container here, NOT an Argo PreSync hook. The first draft was a
          # hook, and it deadlocked: PreSync runs before everything else in the
          # sync, including the ExternalSecret that produces the very credential
          # the Job needs, so the Job waited for a Secret whose producer was
          # waiting for the Job. Inside the pod the ordering is guaranteed and the
          # chart has already wired the database environment.
          extraInitContainers: |
            - name: create-schema
              image: ghcr.io/cloudnative-pg/postgresql:18.6
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash","-c"]
              args:
                - |
                  set -euo pipefail
                  export PGHOST="$KC_DB_URL_HOST" PGPORT="$KC_DB_URL_PORT"
                  export PGDATABASE="$KC_DB_URL_DATABASE"
                  export PGUSER="$KC_DB_USERNAME" PGPASSWORD="$KC_DB_PASSWORD"
                  psql -v ON_ERROR_STOP=1 -c \
                    "CREATE SCHEMA IF NOT EXISTS keycloak_schema AUTHORIZATION keycloak"
                  echo "keycloak_schema present"
              env:
                - { name: KC_DB_URL_HOST,     value: platform-rw.postgres.svc }
                - { name: KC_DB_URL_PORT,     value: "5432" }
                - { name: KC_DB_URL_DATABASE, value: auth_db }
                - { name: KC_DB_USERNAME,     value: keycloak }
                - name: KC_DB_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: keycloak-db, key: KC_DB_PASSWORD }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 26
                capabilities: { drop: [ ALL ] }

          health:
            enabled: true

          # One replica. ADR-006's risk table asks for 2+ with a PDB; that is the
          # production shape, and on one machine a second replica survives nothing.
          replicaCount: 1

          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits:   { memory: 1536Mi }

    - repoURL: https://github.com/vaullet-dev/gitops.git
      targetRevision: main
      path: apps/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true ]
