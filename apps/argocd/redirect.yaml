# http -> https for argo.vaullet.dev. Same reasoning as the hello app's:
# .dev is HSTS-preloaded so browsers never try http, but curl and link
# checkers do.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-https-redirect
spec:
  parentRefs:
    - name: vaullet
      namespace: traefik
      kind: Gateway
      sectionName: web
  hostnames:
    - argo.vaullet.dev
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
