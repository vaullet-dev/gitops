# The OpenBao store for pgAdmin's own login. One namespace, one reader: pgAdmin reads
# kv/pgadmin/admin and nothing else. The database password it logs in with is NOT here:
# that is kv/postgres/dba-rw, read by CloudNativePG through openbao-postgres, and typed
# into pgAdmin by a person.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-pgadmin
spec:
  conditions:
    - namespaces: [ pgadmin ]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-ca
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: pgadmin            # created by: 03-openbao.sh onboard pgadmin
          serviceAccountRef:
            name: secrets-reader
            namespace: pgadmin
