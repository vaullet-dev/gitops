# The OpenBao store for the openbao namespace itself: oauth2-proxy's GitHub client and cookie
# secret (apps/openbao-ui). Nothing in OpenBao's own server config comes from here.
#
# It is not circular in any way that bites. When OpenBao is sealed ESO cannot refresh, but the
# Secret it last wrote stays, so the proxy keeps serving the sealed UI, which is where unsealing
# from a browser happens.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-openbao
spec:
  conditions:
    - namespaces: [ openbao ]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-ca
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openbao            # created by: 03-openbao.sh onboard openbao
          serviceAccountRef:
            name: secrets-reader
            namespace: openbao
