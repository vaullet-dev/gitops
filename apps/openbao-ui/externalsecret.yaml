# oauth2-proxy's three secrets, from OpenBao kv/openbao/oauth2-proxy. Created once by a human:
#
#   bao kv put kv/openbao/oauth2-proxy \
#     client_id=<GitHub OAuth app client ID> \
#     client_secret=<GitHub OAuth app client secret> \
#     cookie_secret="$(openssl rand -base64 32 | tr -- '+/' '-_')"
#
# The GitHub OAuth app's callback URL must be exactly https://bao.vaullet.dev/oauth2/callback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-openbao }
  target:
    name: oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: openbao/oauth2-proxy, property: client_id }
    - secretKey: client-secret
      remoteRef: { key: openbao/oauth2-proxy, property: client_secret }
    - secretKey: cookie-secret
      remoteRef: { key: openbao/oauth2-proxy, property: cookie_secret }
