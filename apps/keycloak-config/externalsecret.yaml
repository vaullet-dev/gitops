# The test users' password: one value shared by all six test users. They exist to exercise roles,
# not to model six people. It lives in OpenBao, never in git. Once, from a shell with the bao CLI:
#
#   bao kv put kv/keycloak/test-users password="$(openssl rand -base64 24)"
#
# Read it back with `bao kv get kv/keycloak/test-users` when you need to log in as one.
#
# The `keycloak` OpenBao role already reads kv/keycloak/* (03-openbao.sh onboard keycloak), and the
# openbao-keycloak store already admits this namespace, so no new grant is needed anywhere.
#
# Until the path exists this reports SecretSyncedError and the import Job cannot start. That is the
# seal working: this Application stays unhealthy, nothing else is affected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-test-users
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-keycloak }
  target:
    name: keycloak-test-users
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        TEST_USERS_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: keycloak/test-users, property: password }
---
# wallet-auth-service's client secret, so the import can set client `wallet-auth-service` to it
# (realm/30-wallet-auth-service.yaml). The same OpenBao path the service reads: one value, two
# readers, as with wallet-auth's database passwords. Read through wallet-auth's own store, which
# admits this namespace for exactly this (apps/secret-stores/wallet-auth.yaml). Once, with a value
# you generate:
#
#   bao kv put kv/wallet-auth/keycloak-client secret="$(openssl rand -base64 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wallet-auth-client
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-wallet-auth }
  target:
    name: wallet-auth-client
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        WALLET_AUTH_CLIENT_SECRET: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef: { key: wallet-auth/keycloak-client, property: secret }
---
# Mailjet's SMTP credentials, for the realm's outgoing mail (realm/05-vaullet-smtp.yaml, gitops#20):
# the API key is the SMTP user and the secret key its password. Read through the keycloak store,
# like keycloak/test-users above, so again nothing new to grant. Once, with the two values from
# Mailjet's API Key Management:
#
#   bao kv put kv/keycloak/smtp username=<API key> password=<secret key>
#
# Rotating the secret key in Mailjet means writing the new one here; the next sync's import sets it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-smtp
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-keycloak }
  target:
    name: keycloak-smtp
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        SMTP_USERNAME: "{{ .username }}"
        SMTP_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: keycloak/smtp, property: username }
    - secretKey: password
      remoteRef: { key: keycloak/smtp, property: password }
---
# Client ledger-ops's secret, so the import can set it (realm/27-vaullet-ledger-ops-client.yaml,
# gitops#29). Read through the wallet-ledger store, which admits this namespace for exactly this
# (apps/secret-stores/wallet-ledger.yaml). Nothing in the cluster authenticates with it: its other
# reader is a person asking Keycloak for a token to call the ledger with (README, "Reaching
# things"). Once, with a value you generate:
#
#   bao kv put kv/wallet-ledger/keycloak-client secret="$(openssl rand -base64 32)"
#
# That store logs in as secrets-reader in wallet-ledger, which the wallet-ledger Application
# creates. Until it exists this reports SecretSyncedError like a missing path does, and the import
# waits with it, every realm file and not only 27-.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-ops-client
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-wallet-ledger }
  target:
    name: ledger-ops-client
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        LEDGER_OPS_CLIENT_SECRET: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef: { key: wallet-ledger/keycloak-client, property: secret }
