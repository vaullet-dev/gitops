apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - externalsecret.yaml
  - job.yaml

# One ConfigMap holding every realm file. The hash suffix means an edited file produces a new
# ConfigMap name, and the Job (recreated on every sync) mounts the new one.
#
# Files are imported in name order, so the numeric prefix is the dependency order: roles exist
# before any user references them, and client scopes before any client lists them.
#
# 05-vaullet-smtp.yaml is the realm's outgoing mail (Mailjet). Every cluster needs one, with its
# own server and sender.
# 06-vaullet-self-registration.yaml lets anyone register on the sign-in page, and has Keycloak
# verify their email address first. It needs 05. A cluster whose users are only invited leaves it
# out from the start; removing it later does not switch registration off (the file says why).
# 12-vaullet-staff-group.yaml is the group that makes a user staff (wallet-auth-service /v1/staff).
# Every cluster keeps it, and it comes before 20, whose staff test users are members.
# 15-vaullet-client-scopes.yaml holds the scopes the services enforce. Every cluster keeps it.
# 16-vaullet-account-id.yaml puts account_id in the token (ADR-006). Every cluster keeps it.
# 20-vaullet-test-users.yaml and 25-vaullet-bruno-client.yaml are DEMO ONLY. A customer cluster
# drops those two lines.
# 26-vaullet-swagger-ui-client.yaml is what Swagger UI signs in with. Every cluster that serves
# Swagger UI keeps it, with its own hostname in redirectUris.
# 27-vaullet-ledger-ops-client.yaml is how staff call the ledger by hand, since it has no route.
# Every cluster keeps it until people get their own way in (the file says why).
# 30-wallet-auth-service.yaml is what local identity mode needs (ADR-014), and the client whose
# ledger:write token opens every new account's wallets, in either mode: every cluster keeps it.
# 31-wallet-transaction-service.yaml is the client whose ledger:reserve token holds each debit's
# money. Every cluster that runs wallet-transaction-service keeps it.
configMapGenerator:
  - name: keycloak-realm-config
    files:
      - realm/05-vaullet-smtp.yaml
      - realm/06-vaullet-self-registration.yaml
      - realm/10-vaullet-roles.yaml
      - realm/12-vaullet-staff-group.yaml
      - realm/15-vaullet-client-scopes.yaml
      - realm/16-vaullet-account-id.yaml
      - realm/20-vaullet-test-users.yaml
      - realm/25-vaullet-bruno-client.yaml
      - realm/26-vaullet-swagger-ui-client.yaml
      - realm/27-vaullet-ledger-ops-client.yaml
      - realm/30-wallet-auth-service.yaml
      - realm/31-wallet-transaction-service.yaml
