# yaml-language-server: $schema=https://raw.githubusercontent.com/adorsys/keycloak-config-cli/main/src/main/resources/keycloak-config-cli-import-schema.json
#
# Client scopes of realm `vaullet`: one per scope a service enforces, so that a token can carry it.
# Today these are wallet-auth-service's three, wallet-ledger-service's three and
# wallet-transaction-service's three:
#
#   identity:read      GET /v1/accounts/**
#   identity:admin     POST, PATCH and DELETE on /v1/accounts/**
#   identity:self      GET and PUT /v1/accounts/me: an end user's own account, and nobody else's
#   ledger:read        every GET on the ledger: balances, reservations, wallets
#   ledger:reserve     POST and DELETE /v1/reservations: holds placed and released, the money path
#   ledger:write       POST, PATCH and DELETE on /v1/wallets: wallets opened, frozen, unfrozen and
#                      closed
#   transaction:self   POST and GET on /v1/transactions/** for an end user: debits of their own
#                      account and reading its transactions, never a credit, never another account
#   transaction:read   GET /v1/transactions/{id}: any transaction, for an operator's backend
#   transaction:write  POST /v1/transactions: a debit or a credit on any account, for an
#                      operator's backend
#
# Without the identity scopes no real token carries one, and every rule in wallet-auth-service
# refuses everyone, SUPER_ADMIN included (its README, "Still open"). A scope says what the client
# may ask for, and the realm role in the same token says who is asking. wallet-auth-service checks
# both.
#
# wallet-ledger-service checks the scope alone. Its callers are services (ADR-008), with no person
# behind the token whose role could narrow it, so on the ledger the scope IS the permission. That is
# why the ledger scopes go only to clients that call the ledger, and never to a client people sign
# in with: on bruno or swagger-ui every user's token would carry them, an end user's included.
# Today that is ledger-ops (27-vaullet-ledger-ops-client.yaml), with all three as default scopes,
# and one service for each of the two that change the ledger: wallet-auth-service
# (30-wallet-auth-service.yaml), whose outbox relay asks for ledger:write to open each new
# account's wallets, and wallet-transaction-service (31-wallet-transaction-service.yaml), which asks
# for ledger:reserve to hold each debit's money.
#
# Holds and wallets were one scope, ledger:write, until gitops#38 and wallet-ledger-service#23
# (architecture's G6). Split, a token that opens wallets cannot hold money, and a token that holds
# money cannot open, freeze or close a wallet. 31- keeps ledger:write as well until gitops#39,
# because its first release asks for it; the file says why.
#
# wallet-transaction-service does one or the other, depending on who calls (its TransactionAccess).
# An end user's call needs transaction:self, the END_USER role and the account_id in the token, and
# reaches that account alone. That is why transaction:self can be a default scope of bruno and
# swagger-ui: every user's token there carries it, staff included, and only an end user's own
# account gets past the rest of the rule. An operator's backend calls with client credentials, with
# no person behind its token, so there transaction:read and transaction:write ARE the permission, as
# the ledger's scopes are, and for the ledger's reason they go to no client people sign in with. No
# operator's backend has a client yet, so no client offers them today: no real token carries them,
# and every operator rule in the service refuses everyone.
#
# ADR-008's scope table is meant to be the source for these, and it does not match them yet. It has
# identity:read and identity:admin but no row for identity:self, and none for the three transaction
# scopes. Its first row has always given Transaction Service ledger:reserve, which this realm has
# since gitops#38; its other ledger rows still have ledger-ops change everything with ledger:write,
# and architecture#7 brings them and the transaction rows in. Until the table agrees, this file is
# the record. When the rows land there, keep the names identical here.
#
# Only `clientScopes` is declared, so nothing else in the realm is touched. Which clients get these
# scopes is up to each client (25-vaullet-bruno-client.yaml, 26-vaullet-swagger-ui-client.yaml,
# 27-vaullet-ledger-ops-client.yaml, 30-wallet-auth-service.yaml,
# 31-wallet-transaction-service.yaml).
#
# job.yaml sets IMPORT_MANAGED_CLIENTSCOPE=no-delete, and this file is why. Without it,
# keycloak-config-cli's default (FULL) would delete, on this file's first import, every client scope
# in the realm that is neither a realm default nor listed here.
realm: vaullet
clientScopes:
  - name: "identity:read"
    description: Read accounts in wallet-auth-service (GET /v1/accounts/**)
    protocol: openid-connect
    attributes:
      # The name lands in the token's `scope` claim, and Spring turns it into SCOPE_identity:read.
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
  - name: "identity:admin"
    description: Create, change and close accounts in wallet-auth-service (POST, PATCH, DELETE)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
  # For end users, not staff: GET and PUT /v1/accounts/me only ever reach the caller's own account.
  # PUT is how a user who signed up themselves, with Google or the registration form, gets their
  # account at first sign-in (just-in-time, wallet-auth-service#24); GET reads it back.
  - name: "identity:self"
    description: An end user's own account in wallet-auth-service (GET and PUT /v1/accounts/me)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
  # The ledger's three (wallet-ledger-service, "Security"). Unlike the three above, nothing else in
  # the token narrows them: whoever holds ledger:reserve may hold and release money on any account,
  # and whoever holds ledger:write may open, freeze and close any account's wallets.
  - name: "ledger:read"
    description: Read the ledger in wallet-ledger-service (every GET)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
  # ADR-008's scope for the money path. Its own, so that holding money and changing wallets are
  # never the same grant (architecture's G6).
  - name: "ledger:reserve"
    description: Place and release holds in wallet-ledger-service (POST and DELETE /v1/reservations)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
  - name: "ledger:write"
    description: Open, freeze and close wallets in wallet-ledger-service (/v1/wallets)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
  # wallet-transaction-service's three (its TransactionAccess). transaction:self is an end user's,
  # and the service checks the END_USER role and the token's account_id with it. The other two are
  # an operator's backend's, and like the ledger's, nothing else in the token narrows them.
  - name: "transaction:self"
    description: An end user's own debits and transactions in wallet-transaction-service (POST, GET)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
  - name: "transaction:read"
    description: Read any transaction in wallet-transaction-service (GET /v1/transactions/{id})
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
  - name: "transaction:write"
    description: Record a debit or a credit on any account in wallet-transaction-service (POST)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
