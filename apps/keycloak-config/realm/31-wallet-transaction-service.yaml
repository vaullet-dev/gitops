# yaml-language-server: $schema=https://raw.githubusercontent.com/adorsys/keycloak-config-cli/main/src/main/resources/keycloak-config-cli-import-schema.json
#
# The client wallet-transaction-service calls the ledger as (ADR-008, Layer 3). Every debit asks the
# ledger to hold its money with POST /v1/reservations, and the ledger checks ledger:write on that
# call. The token is the service's own, never its caller's: the ledger trusts this service, which
# has already decided who may ask, and a user's token is never a way to the ledger.
#
# Confidential, and client credentials only, like ledger-ops (27-): no browser login, no password
# grant, no implicit flow. A token comes from the secret and from nothing else. The secret is
# OpenBao kv/wallet-transaction/keycloak-client, the same value the service authenticates with,
# which the import sets as $(env:WALLET_TRANSACTION_CLIENT_SECRET).
#
# ledger:write is OPTIONAL, as on wallet-auth-service (30-): a token carries it only when asked for
# with scope=ledger:write. The service asks for it on every token, because it fetches tokens for the
# ledger and for nothing else. Not ledger:read: it places holds and reads nothing back.
#
# Both lists are named, for 30-'s reason: then they are the same on every cluster, whether the
# import creates the client or updates it. The default list is empty, for 27-'s: no profile, email,
# roles or account-id, because no user is behind the token; no web-origins, because no browser
# calls with it; and not basic, because a client-credentials token gets its `sub` without it. That
# leaves service_account, which Keycloak gives every client with a service account (27-), and
# ledger:write when it is asked for.
#
# fullScopeAllowed: false. The ledger needs no realm role, and with no role mapped to this client
# none can reach its tokens, not even one granted to its service account by hand later. Nor does
# this file give the service account a role, unlike 30-: the service manages nothing in the realm.
#
# What ledger:write allows is the ledger's to say (15-vaullet-client-scopes.yaml): a hold on any
# account, and opening, freezing and closing any account's wallets as well. This makes the service
# the second one holding it, after wallet-auth-service's outbox relay. Architecture's G6 accepted
# the scope as it is only while the relay was the only one, and proposed splitting it first, with
# ADR-008's ledger:reserve for holds. Until it is split, the service's own code is all that keeps
# its token to POST /v1/reservations.
#
# Every cluster that runs wallet-transaction-service keeps this file. Without the client the service
# gets no token, and no debit reaches the ledger.
realm: vaullet
clients:
  - clientId: wallet-transaction-service
    name: wallet-transaction-service
    description: Transaction service. Has the ledger hold each debit's money (client credentials).
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    # OpenBao kv/wallet-transaction/keycloak-client, through externalsecret.yaml
    # (wallet-transaction-client): the same value the service authenticates with.
    secret: "$(env:WALLET_TRANSACTION_CLIENT_SECRET)"
    # Client credentials only. No browser flow and no password grant: nobody logs in as this client.
    serviceAccountsEnabled: true
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    frontchannelLogout: false
    fullScopeAllowed: false
    defaultClientScopes: []
    optionalClientScopes:
      - "ledger:write"
