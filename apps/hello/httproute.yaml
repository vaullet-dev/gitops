# No Ingress object anywhere in this cluster. This attaches to the two HTTPS
# listeners on the shared Gateway by sectionName -- deliberately NOT to the
# :80 listener, so nothing here is ever served in plaintext.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
spec:
  parentRefs:
    - name: vaullet
      namespace: traefik
      kind: Gateway
      sectionName: websecure
    - name: vaullet
      namespace: traefik
      kind: Gateway
      sectionName: www
  hostnames:
    - vaullet.dev
    - www.vaullet.dev
  rules:
    - backendRefs:
        # Gateway API backendRefs take a numeric port, not a port name.
        - name: hello
          port: 80
