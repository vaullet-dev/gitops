apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - redirect.yaml
configMapGenerator:
  - name: hello-content
    files:
      - index.html
# Hash suffix means editing index.html rolls the Deployment automatically.
generatorOptions:
  disableNameSuffixHash: false
