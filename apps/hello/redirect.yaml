# http -> https on the :80 listener.
#
# .dev is on the HSTS preload list, so a browser rewrites http://vaullet.dev to
# https:// before a packet leaves the machine and will never see this. It is
# here for curl, old clients and link checkers.
#
# It does NOT break the ACME HTTP-01 challenge: cert-manager's solver HTTPRoute
# matches the challenge path with type Exact, and Gateway API precedence puts an
# exact path match above this PathPrefix "/". Even so, if a certificate ever
# hangs in a challenge loop, THIS IS THE FIRST FILE TO DELETE while diagnosing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: vaullet
      namespace: traefik
      kind: Gateway
      sectionName: web
  hostnames:
    - vaullet.dev
    - www.vaullet.dev
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
