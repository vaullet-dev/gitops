apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 1
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: conf,    mountPath: /etc/nginx/conf.d }
            - { name: cache,   mountPath: /var/cache/nginx }
            - { name: run,     mountPath: /var/run }
          resources:
            requests: { cpu: 10m,  memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: content
          configMap: { name: hello-content }
        - name: conf
          configMap: { name: hello-nginx-conf }
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
# nginx:alpine defaults to :80, which a non-root container cannot bind.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-nginx-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
    }
