# A Rollout, not a Deployment. Same pod spec; the controller changes how new
# versions reach it.
#
# replicas is 2 rather than 1 on purpose: a 50% canary weight against a single
# replica is meaningless, because one pod cannot be half-replaced. Two is the
# smallest number that makes the step real. Each pod requests 10m CPU / 16Mi.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello
spec:
  replicas: 2
  # How many past versions the UI offers to roll back to.
  revisionHistoryLimit: 5
  strategy:
    canary:
      steps:
        # Send half the traffic to the new version...
        - setWeight: 50
        # ...then stop and wait for a human. An empty pause has no duration,
        # so the rollout sits here indefinitely until someone clicks Promote
        # (or Abort). This is the button.
        #
        # Note: with no traffic-manager plugin, weight is approximated by
        # replica count -- 50% means one of two pods. Real header/weight-based
        # splitting on Gateway API needs the Gateway API plugin, which is worth
        # adding only once there is traffic to split.
        - pause: {}
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: conf,    mountPath: /etc/nginx/conf.d }
            - { name: cache,   mountPath: /var/cache/nginx }
            - { name: run,     mountPath: /var/run }
          resources:
            requests: { cpu: 10m,  memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: content
          configMap: { name: hello-content }
        - name: conf
          configMap: { name: hello-nginx-conf }
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
# nginx:alpine defaults to :80, which a non-root container cannot bind.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-nginx-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
    }
