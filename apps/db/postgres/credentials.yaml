# Passwords for the database owner roles that CloudNativePG did not create at
# bootstrap. `initdb` makes exactly one role per cluster and generates its
# password into <cluster>-app; every ADDITIONAL owner (`transactions`,
# `support`) is declared in managed.roles and starts with no password, so it can
# own its schema but cannot log in.
#
# Those passwords come from OpenBao, never from git. The chain is:
#
#   OpenBao kv/postgres/<role>  ->  ExternalSecret  ->  Secret  ->  CNPG
#                                                                  managed.roles
#
# PREREQUISITES, run once by a human (bootstrap/03-openbao.sh needs the root
# token, and `init` prints the only copy of the unseal keys):
#
#   bootstrap/03-openbao.sh unseal
#   bootstrap/03-openbao.sh onboard postgres
#   # then, in the same session, with a password you generate:
#   bao kv put kv/postgres/transactions password=...
#   bao kv put kv/postgres/support      password=...
#
# Until that is done the two ExternalSecrets stay SecretSyncedError and the two
# roles stay without a password. That is the seal working, not a fault.
---
# The identity OpenBao's kubernetes auth role is bound to. `onboard <ns>` binds
# the role to exactly this service account name in exactly this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
---
# One store per consumer namespace, not one global store. `conditions` is what
# stops any other namespace borrowing this identity to read kv/postgres/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-postgres
spec:
  conditions:
    - namespaces: [ postgres ]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      # OpenBao serves a cert from its own namespaced cert-manager CA, so the
      # public trust store is no help. Point at that CA rather than disabling
      # verification.
      caProvider:
        type: Secret
        name: openbao-ca
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgres          # created by: 03-openbao.sh onboard postgres
          serviceAccountRef:
            name: secrets-reader
            namespace: postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transactions-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-postgres
  target:
    name: transactions-db-credentials
    creationPolicy: Owner
    template:
      # basic-auth so the username travels with the password; CloudNativePG
      # reads the `password` key from it.
      type: kubernetes.io/basic-auth
      data:
        username: transactions
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres/transactions
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: support-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-postgres
  target:
    name: support-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: support
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres/support
        property: password
---
# The migrator password again, in THIS namespace, so CloudNativePG can set the
# role to it. Same OpenBao path as the Job reads -- one value, two readers --
# via the wallet-auth store, which names `postgres` in its conditions precisely
# for this. Storing a second copy under kv/postgres/ would be two values that
# drift, and the drift would look like an authentication bug.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-migrator-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-wallet-auth
  target:
    name: auth-migrator-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: auth_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wallet-auth/db-migrator
        property: password
---
# The app role's password, in the postgres namespace so CloudNativePG can set it.
# Same OpenBao path the service reads from; see the note on auth-migrator-db.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-app-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-wallet-auth }
  target:
    name: auth-app-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: auth_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: wallet-auth/db-app, property: password }
---
# Keycloak's database password. Read through Keycloak's own store, which names
# `postgres` in its conditions for exactly this reason.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-keycloak }
  target:
    name: keycloak-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: keycloak
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: keycloak/db, property: password }
