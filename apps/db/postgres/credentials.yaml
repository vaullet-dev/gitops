# Passwords for the database owner roles that CloudNativePG did not create at
# bootstrap. `initdb` makes exactly one role per cluster and generates its
# password into <cluster>-app; every ADDITIONAL owner (`transactions`,
# `support`) is declared in managed.roles and starts with no password, so it can
# own its schema but cannot log in.
#
# Those passwords come from OpenBao, never from git. The chain is:
#
#   OpenBao kv/postgres/<role>  ->  ExternalSecret  ->  Secret  ->  CNPG
#                                                                  managed.roles
#
# PREREQUISITES, run once by a human (bootstrap/03-openbao.sh needs the root
# token, and `init` prints the only copy of the unseal keys):
#
#   bootstrap/03-openbao.sh unseal
#   bootstrap/03-openbao.sh onboard postgres
#   # then, in the same session, with a password you generate:
#   bao kv put kv/postgres/transactions password=...
#   bao kv put kv/postgres/support      password=...
#
# Until that is done the two ExternalSecrets stay SecretSyncedError and the two
# roles stay without a password. That is the seal working, not a fault.
---
# The identity OpenBao's kubernetes auth role is bound to. `onboard <ns>` binds
# the role to exactly this service account name in exactly this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
---
# One store per consumer namespace, not one global store. `conditions` is what
# stops any other namespace borrowing this identity to read kv/postgres/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-postgres
spec:
  conditions:
    - namespaces: [ postgres ]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      # OpenBao serves a cert from its own namespaced cert-manager CA, so the
      # public trust store is no help. Point at that CA rather than disabling
      # verification.
      caProvider:
        type: Secret
        name: openbao-ca
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgres          # created by: 03-openbao.sh onboard postgres
          serviceAccountRef:
            name: secrets-reader
            namespace: postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transactions-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-postgres
  target:
    name: transactions-db-credentials
    creationPolicy: Owner
    template:
      # basic-auth so the username travels with the password; CloudNativePG
      # reads the `password` key from it.
      type: kubernetes.io/basic-auth
      data:
        username: transactions
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres/transactions
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: support-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-postgres
  target:
    name: support-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: support
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres/support
        property: password
---
# The migrator password again, in THIS namespace, so CloudNativePG can set the
# role to it. Same OpenBao path as the Job reads -- one value, two readers --
# via the wallet-auth store, which names `postgres` in its conditions precisely
# for this. Storing a second copy under kv/postgres/ would be two values that
# drift, and the drift would look like an authentication bug.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-migrator-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-wallet-auth
  target:
    name: auth-migrator-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: auth_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wallet-auth/db-migrator
        property: password
---
# The app role's password, in the postgres namespace so CloudNativePG can set it.
# Same OpenBao path the service reads from; see the note on auth-migrator-db.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-app-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-wallet-auth }
  target:
    name: auth-app-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: auth_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: wallet-auth/db-app, property: password }
---
# The ledger's migrator password, in this namespace so CloudNativePG can set
# ledger_migrator (money.yaml) to it. Same note as auth-migrator-db: the OpenBao path
# the ledger's Flyway Job reads, one value and two readers, through the wallet-ledger
# store, which names `postgres` in its conditions for exactly this.
#
# That store logs in as secrets-reader in wallet-ledger, so on a first install this and
# ledger-app-db report SecretSyncedError until the wallet-ledger Application has created
# it (clusters/prod/wallet-ledger.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-migrator-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-wallet-ledger }
  target:
    name: ledger-migrator-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ledger_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: wallet-ledger/db-migrator, property: password }
---
# The ledger's app role, likewise: the path the running ledger reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-app-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-wallet-ledger }
  target:
    name: ledger-app-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ledger_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: wallet-ledger/db-app, property: password }
---
# Keycloak's database password. Read through Keycloak's own store, which names
# `postgres` in its conditions for exactly this reason.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-keycloak }
  target:
    name: keycloak-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: keycloak
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: keycloak/db, property: password }
---
# dba_rw's password, for pgAdmin (gitops#33), from OpenBao kv/postgres/dba-rw. One Secret
# here serves all three clusters, because they all live in this namespace. Its second
# reader is a person: pgAdmin asks for it the first time a server is opened. Read it in
# the OpenBao UI, or: bao kv get -field=password kv/postgres/dba-rw
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dba-rw-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-postgres
  target:
    name: dba-rw-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: dba_rw
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres/dba-rw
        property: password
