# The ledger and the transaction lifecycle. One restore unit: rewinding one of
# these without the other leaves them disagreeing about money that exists.
#
# Decisions that apply to all three clusters, stated once here:
#
#   instances: 1     Deliberate. CloudNativePG scales by changing this number --
#                    going to 3 later makes standbys with pg_basebackup, it is
#                    not a redesign. The cost accepted today is that draining or
#                    rebooting this node is a database outage.
#
#   imageName 18.6   Matches the PostgreSQL that wallet-auth-service's
#                    V1__identity.sql was generated and approved against
#                    (Flyway checksum -413149361). A major-version mismatch
#                    would not fail the migration, it would change the schema
#                    docs that approval was given on.
#
#   dataChecksums    ON, and it cannot be turned on later without rewriting
#                    every page offline. Three VMs share one RAID1 array; this
#                    is what turns silent corruption into a loud error.
#
#   localeProvider   builtin/C.UTF-8 rather than glibc. THIS IS IRREVERSIBLE
#                    without a dump and restore. glibc collation changes between
#                    distro releases, and when it does, every text index built
#                    under the old rules is silently wrong -- a real and
#                    well-documented way to corrupt a database by upgrading the
#                    base image. The builtin provider is byte-order, defined by
#                    PostgreSQL itself, and never changes. The trade: ORDER BY on
#                    text is byte-order, so anything user-facing that needs
#                    natural language ordering must say COLLATE explicitly.
#
#   nodeSelector     local-path binds a volume to whichever node the pod first
#                    lands on, permanently. Choosing here beats discovering it
#                    later from a PV's nodeAffinity.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: money
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  primaryUpdateStrategy: unsupervised

  # ON, deliberately, and it was off in the first draft. The backup CronJob dumps
  # every database in this cluster, and the per-database owner roles have no
  # password until OpenBao supplies one -- so without this there is no identity
  # able to read them all. `pg_dumpall --globals-only` also needs superuser to
  # include role definitions; a lesser role writes a globals file that silently
  # omits them, which you find out during a restore.
  #
  # The credential is generated and rotated by CloudNativePG into the Secret
  # <cluster>-superuser. It never appears in git. Narrow it to a dedicated
  # pg_read_all_data role once OpenBao can supply that role's password.
  enableSuperuserAccess: true

  affinity:
    nodeSelector:
      kubernetes.io/hostname: k8s-1

  storage:
    storageClass: local-path
    size: 20Gi

  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { memory: 2Gi }

  postgresql:
    parameters:
      shared_buffers: "512MB"
      max_connections: "100"
      # The ledger waits for its WAL to reach disk. This is the setting that
      # makes "committed" mean committed, and it is the whole point of ADR-004.
      synchronous_commit: "on"

  bootstrap:
    initdb:
      database: vaullet_db
      owner: vaullet
      encoding: UTF8
      localeProvider: builtin
      builtinLocale: C.UTF-8
      dataChecksums: true

  managed:
    roles:
      # Owner of transactions_db (the Database below), as `vaullet` owns vaullet_db.
      # wallet-transaction-service does not connect as it: its Flyway Job runs as
      # transaction_migrator, a member of this role, and the service as
      # transaction_app, both below. Its own password comes from OpenBao, at
      # kv/postgres/transactions, which is the only way ADR-003's "no credential in
      # git" holds for a role that can log in.
      - name: transactions
        ensure: present
        login: true
        comment: owner of transactions_db
        # Sourced from OpenBao via ESO -- see credentials.yaml. Until the
        # vault is unsealed and onboarded this Secret does not exist, and
        # CloudNativePG reports the role unreconciled rather than failing
        # the cluster.
        passwordSecret:
          name: transactions-db-credentials
      # The identity that runs Flyway for wallet-ledger-service, and the ONLY one with
      # DDL rights on vaullet_db, the ledger's database (ADR-003). Same split as
      # auth_migrator and auth_app in platform.yaml, for the same reason: the running
      # ledger holds a role with no DDL at all.
      #
      # inRoles: [vaullet] for platform.yaml's reason too: `vaullet` owns vaullet_db
      # (initdb above), and CloudNativePG can declare membership but not an arbitrary
      # GRANT. Same cost as well: what Flyway creates belongs to ledger_migrator, so
      # ledger_app can touch nothing until the ledger's own migration grants it.
      - name: ledger_migrator
        ensure: present
        login: true
        inRoles: [ vaullet ]
        comment: runs Flyway for wallet-ledger-service; holds DDL on vaullet_db
        passwordSecret:
          name: ledger-migrator-db-credentials
      # What the RUNNING ledger connects as. No inRoles: it inherits nothing, and the
      # ledger's V3 migration grants it what each table needs, table by table, and never
      # DELETE: nothing in a ledger is removed. It owns nothing either, which is what
      # makes the journal's append-only rules hold against the service itself: only a
      # table's owner can drop a rule from it.
      #
      # It has to exist before that migration runs, and ledger_migrator cannot create
      # roles, so it comes from here, like its password.
      - name: ledger_app
        ensure: present
        login: true
        comment: the running wallet-ledger-service; no DDL, no DELETE
        passwordSecret:
          name: ledger-app-db-credentials
      # The identity that runs Flyway for wallet-transaction-service, and the ONLY one with
      # DDL rights on transactions_db. The ledger's split, for the ledger's reason: the
      # running service holds a role with no DDL at all.
      #
      # inRoles: [transactions] for the ledger's reason too: `transactions` owns
      # transactions_db, and CloudNativePG can declare membership but not an arbitrary
      # GRANT. The membership is also what lets Flyway create in schema public, which
      # PostgreSQL 15 and later leave to the database's owner. Same cost as well: what
      # Flyway creates belongs to transaction_migrator, so transaction_app can touch
      # nothing until the service's own migrations grant it.
      #
      # A member needs its role to exist first, so this one also waits for `transactions`
      # and that role's password, kv/postgres/transactions (credentials.yaml).
      - name: transaction_migrator
        ensure: present
        login: true
        inRoles: [ transactions ]
        comment: runs Flyway for wallet-transaction-service; holds DDL on transactions_db
        passwordSecret:
          name: transaction-migrator-db-credentials
      # What the RUNNING wallet-transaction-service connects as. No inRoles: it inherits
      # nothing, and the service's migrations grant it what each table needs, table by
      # table, and never DELETE or TRUNCATE: a transaction ends DECLINED, VOIDED, EXPIRED
      # or CAPTURED, and is never erased. It owns nothing either, so the service cannot
      # drop a constraint its migrations wrote: only a table's owner can.
      #
      # It has to exist before those migrations run, and transaction_migrator cannot create
      # roles, so it comes from here, like its password. The service's V1__app_role.sql
      # creates it NOLOGIN only where it is missing, for a laptop's or a test's database;
      # here it finds this one and leaves its login and password as they are.
      - name: transaction_app
        ensure: present
        login: true
        comment: the running wallet-transaction-service; no DDL, no DELETE
        passwordSecret:
          name: transaction-app-db-credentials
      # pgAdmin's login (apps/pgadmin, gitops#33): reads and writes every table, in every
      # database of this cluster, and nothing more. pg_read_all_data and pg_write_all_data
      # are table-level only: no DDL, no roles, no superuser, and the ledger journal's
      # append-only rules still apply to it, because only a table's owner can drop a rule.
      # One password for all three clusters, generated in credentials.yaml.
      - name: dba_rw
        ensure: present
        login: true
        inRoles: [ pg_read_all_data, pg_write_all_data ]
        comment: pgAdmin, a person at the keyboard; table data only, no DDL
        passwordSecret:
          name: dba-rw-db-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: transactions
spec:
  name: transactions_db
  owner: transactions
  cluster:
    name: money
  # retain, not delete: removing this object must never drop the database.
  databaseReclaimPolicy: retain
