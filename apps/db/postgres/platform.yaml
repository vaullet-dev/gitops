# Identity and the supporting services. Independent of money -- restoring
# auth_db to an earlier point is coherent on its own, which is exactly why it
# does not belong in the money cluster.
#
# This is the cluster wallet-auth-service needs first: auth_db holds the account
# anchor from ADR-014.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true    # see money.yaml for why; the backup job needs it

  affinity:
    nodeSelector:
      kubernetes.io/hostname: k8s-2

  storage:
    storageClass: local-path
    size: 10Gi

  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { memory: 1Gi }

  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "100"

  bootstrap:
    initdb:
      database: auth_db
      owner: auth
      encoding: UTF8
      localeProvider: builtin
      builtinLocale: C.UTF-8
      dataChecksums: true

  managed:
    roles:
      - name: support
        ensure: present
        login: true
        comment: owner of support_db
        # Sourced from OpenBao via ESO -- see credentials.yaml. Until the
        # vault is unsealed and onboarded this Secret does not exist, and
        # CloudNativePG reports the role unreconciled rather than failing
        # the cluster.
        passwordSecret:
          name: support-db-credentials
      # The identity that runs Flyway for wallet-auth-service, and the ONLY one
      # with DDL rights on auth_db. The running service holds a different role
      # with none, which is what makes "the application cannot drop a table" a
      # property of what is mounted rather than a promise in a document.
      #
      # inRoles: [auth] rather than a bare GRANT, because `auth` owns auth_db and
      # CloudNativePG can express membership declaratively while it cannot express
      # an arbitrary GRANT. The cost is that objects Flyway creates are owned by
      # auth_migrator, so the application role will need explicit grants when it
      # lands -- noted here rather than discovered then.
      - name: auth_migrator
        ensure: present
        login: true
        inRoles: [ auth ]
        comment: runs Flyway for wallet-auth-service; holds DDL on auth_db
        passwordSecret:
          name: auth-migrator-db-credentials
      # What the RUNNING auth service connects as. No inRoles, deliberately: it
      # inherits nothing, and V2__grant_app_role.sql gives it SELECT/INSERT/UPDATE
      # on one table and nothing else. Not even DELETE -- ADR-014 makes closure a
      # status transition, so no code path should remove an account row.
      - name: auth_app
        ensure: present
        login: true
        comment: the running wallet-auth-service; no DDL, no DELETE
        passwordSecret:
          name: auth-app-db-credentials

      # Keycloak owns keycloak_schema in this same database (ADR-003). It manages
      # its own schema across upgrades, so it genuinely needs DDL -- hence
      # membership of `auth`, which owns auth_db. It has no rights in
      # identity_schema and wallet-auth-service has none in keycloak_schema; the
      # boundary is ownership, not hope.
      - name: keycloak
        ensure: present
        login: true
        inRoles: [ auth ]
        comment: Keycloak's own schema in auth_db (ADR-003)
        passwordSecret:
          name: keycloak-db-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: support
spec:
  name: support_db
  owner: support
  cluster:
    name: platform
  databaseReclaimPolicy: retain
