# Fraud detection, and later the optional reward and warehouse databases.
# Read-heavy, and the one group whose durability requirements are looser than
# the ledger's.
#
# Only fraud_db exists today. ADR-003's "provisioning is a function of the
# contract" says rewards_db and datawarehouse_db are created only when a module
# that needs them is sold, so they are deliberately absent rather than forgotten
# -- they join this cluster, as Database objects, when that happens.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: analytics
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true    # see money.yaml for why; the backup job needs it

  affinity:
    nodeSelector:
      kubernetes.io/hostname: k8s-3

  storage:
    storageClass: local-path
    size: 10Gi

  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { memory: 1Gi }

  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "100"

  bootstrap:
    initdb:
      database: fraud_db
      owner: fraud
      encoding: UTF8
      localeProvider: builtin
      builtinLocale: C.UTF-8
      dataChecksums: true
