# Bootstrap admin. Keycloak 26 renamed these from KEYCLOAK_ADMIN*; the old names
# are silently ignored, which presents as "admin account was never created".
#
# They are BOOTSTRAP credentials: Keycloak uses them only when the realm has no
# admin yet. Once a permanent admin exists they should be removed, the same way
# argocd-initial-admin-secret should be (TODO.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-keycloak }
  target:
    name: keycloak-admin
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        KC_BOOTSTRAP_ADMIN_USERNAME: "{{ .username }}"
        KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: keycloak/admin, property: username }
    - secretKey: password
      remoteRef: { key: keycloak/admin, property: password }
---
# The database credential. Same OpenBao path CloudNativePG reads to SET the
# role's password -- one value, two readers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-keycloak }
  target:
    name: keycloak-db
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        KC_DB_USERNAME: keycloak
        KC_DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: keycloak/db, property: password }
