# auth.vaullet.dev. ADR-006 fixes the issuer as https://auth.<cluster>/realms/vaullet,
# so this hostname appears inside every token's `iss` claim and in every resource
# server's validation config -- it is an interface, not a routing choice.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
spec:
  parentRefs:
    - { name: vaullet, namespace: traefik, kind: Gateway, sectionName: auth }
  hostnames: [ auth.vaullet.dev ]
  rules:
    - backendRefs:
        - { name: keycloak-keycloakx-http, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-https-redirect
spec:
  parentRefs:
    - { name: vaullet, namespace: traefik, kind: Gateway, sectionName: web }
  hostnames: [ auth.vaullet.dev ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: / } } ]
      filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
