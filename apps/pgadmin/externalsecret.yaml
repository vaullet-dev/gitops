# pgAdmin's own login, from OpenBao kv/pgadmin/admin (email, password). Read it in the
# OpenBao UI, or: bao kv get kv/pgadmin/admin
#
# pgAdmin reads it ONLY when its volume is empty, to create that first user. Changing it in
# OpenBao afterwards changes nothing: change the password in pgAdmin itself, then in OpenBao,
# so the two still match.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-pgadmin }
  target:
    name: pgadmin-admin
    creationPolicy: Owner
  data:
    - secretKey: email
      remoteRef: { key: pgadmin/admin, property: email }
    - secretKey: password
      remoteRef: { key: pgadmin/admin, property: password }
