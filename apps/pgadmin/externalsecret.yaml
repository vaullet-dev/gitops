# pgAdmin's own login. No OpenBao: External Secrets generates the password once
# (refreshInterval 0 = never again), and it lives only in this Secret. Read it with
#
#   kubectl -n pgadmin get secret pgadmin-admin -o jsonpath='{.data.password}' | base64 -d
#
# pgAdmin reads it ONLY when its volume is empty, to create that first user. Change the
# password in pgAdmin itself after that.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: pgadmin-admin
spec:
  length: 32
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-admin
spec:
  refreshInterval: "0"
  target:
    name: pgadmin-admin
    creationPolicy: Owner
    template:
      data:
        email: admin@vaullet.dev
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pgadmin-admin
